[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fang-ssh"
version = "1.1.0"
description = "SSH brute-force detector for Linux auth logs: sliding-window detection, severity scoring, and JSON evidence reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hassan Ali (X-4xu)" }
]
keywords = ["ssh", "security", "brute-force", "intrusion-detection", "log-analysis", "blue-team", "linux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
]

[project.scripts]
fang = "fang.cli:main"

[project.urls]
Homepage = "https://github.com/X-4xu/fang-ssh"
Issues = "https://github.com/X-4xu/fang-ssh/issues"
Changelog = "https://github.com/X-4xu/fang-ssh/blob/main/CHANGELOG.md"
Source = "https://github.com/X-4xu/fang-ssh"

[tool.setuptools]
packages = ["fang", "fang.handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
