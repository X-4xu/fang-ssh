[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fang-ssh"
dynamic = ["version"]
description = "Defensive SSH brute-force, password-spraying and possible-compromise detector for Linux auth logs and journald."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hassan Ali (X-4xu)" }]
keywords = ["ssh", "security", "brute-force", "intrusion-detection", "log-analysis", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# No third-party runtime dependencies on Python 3.11+.
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
fang = "fang.cli:main"

[project.urls]
Homepage = "https://github.com/X-4xu/fang"
Issues = "https://github.com/X-4xu/fang/issues"
Changelog = "https://github.com/X-4xu/fang/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "fang._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fang = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["fang"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "PT"]
ignore = ["S101", "S603", "S607", "E501"]  # E501: `ruff format` owns code wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "PT011", "PT012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/fang"]

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
