<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="440" x2="1280" y2="440"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Left Side: Project Branding -->
  <g transform="translate(90, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="210" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">OPEN SOURCE SECURITY</text>

    <!-- Logo / Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">
      fang<tspan fill="#38bdf8">-ssh</tspan>
    </text>

    <!-- Subtitle / Pitch -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">
      SSH Brute-Force Log Analyzer
    </text>

    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b" width="480">
      Sliding-window burst detection, burst-then-login correlation,
    </text>
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      and JSON forensic evidence. 100% read-only &amp; non-blocking.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="14" y="21" font-family="monospace" font-size="13" fill="#38bdf8">--follow</text>

      <!-- Tag 2 -->
      <rect x="122" y="0" width="130" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="136" y="21" font-family="monospace" font-size="13" fill="#38bdf8">--journalctl</text>

      <!-- Tag 3 -->
      <rect x="264" y="0" width="115" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="278" y="21" font-family="monospace" font-size="13" fill="#38bdf8">stdin pipe</text>

      <!-- Tag 4 -->
      <rect x="391" y="0" width="115" height="32" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="405" y="21" font-family="monospace" font-size="13" fill="#f43f5e">CRITICAL</text>
    </g>

    <!-- Version & Stats -->
    <g transform="translate(0, 365)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
        v1.1.0 Released <tspan fill="#475569">•</tspan> GitHub Release <tspan fill="#475569">•</tspan> MIT Licensed
      </text>
    </g>
  </g>

  <!-- Right Side: Terminal Mockup -->
  <g transform="translate(640, 100)" filter="url(#shadow)">
    <!-- Terminal Window Frame -->
    <rect x="0" y="0" width="560" height="440" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="560" height="42" rx="12" fill="#111827"/>
    <rect x="0" y="30" width="560" height="12" fill="#111827"/>
    <line x1="0" y1="42" x2="560" y2="42" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="280" y="26" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">bash — fang --follow /var/log/auth.log</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 66)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" xml:space="preserve">
      <!-- Command -->
      <text x="0" y="16" fill="#64748b">$ <tspan fill="#38bdf8">fang</tspan> --follow /var/log/auth.log --json-out alerts.json</text>
      <text x="0" y="38" fill="#475569">[+] Tailing /var/log/auth.log in real time (Ctrl+C to stop)...</text>
      
      <!-- Event 1 -->
      <text x="0" y="74" fill="#94a3b8">2026-10-28T13:00:12 <tspan fill="#f59e0b" font-weight="bold">[HIGH]</tspan> 203.0.113.195</text>
      <text x="0" y="94" fill="#64748b">    Attempts: 6 failures in 42s (threshold: 5/120s)</text>
      <text x="0" y="112" fill="#64748b">    Targeted users: root, admin, postgres</text>

      <!-- Event 2 - Critical Compromise -->
      <text x="0" y="152" fill="#94a3b8">2026-10-28T13:02:45 <tspan fill="#f43f5e" font-weight="bold">[CRITICAL] POSSIBLE COMPROMISE</tspan></text>
      <text x="0" y="172" fill="#ef4444">    Source IP: 198.51.100.42</text>
      <text x="0" y="190" fill="#fca5a5">    Alert: 9 failed attempts followed by ACCEPTED LOGIN</text>
      <text x="0" y="208" fill="#fca5a5">    User: deploy (port: 52140)</text>

      <!-- Divider -->
      <line x1="0" y1="230" x2="512" y2="230" stroke="#1e293b" stroke-width="1"/>

      <!-- Summary Stats -->
      <text x="0" y="260" fill="#38bdf8">Summary Report:</text>
      <text x="0" y="280" fill="#94a3b8">  • Events Processed: <tspan fill="#f8fafc">14,290</tspan></text>
      <text x="0" y="300" fill="#94a3b8">  • Flagged Threat IPs: <tspan fill="#f43f5e">18</tspan></text>
      <text x="0" y="320" fill="#94a3b8">  • Forensic Export: <tspan fill="#10b981">alerts.json (Saved)</tspan></text>

      <!-- Cursor -->
      <text x="0" y="352" fill="#38bdf8">$ <tspan fill="#94a3b8">fang --version</tspan></text>
      <text x="0" y="370" fill="#10b981">fang 1.1.0</text>
    </g>
  </g>
</svg>
